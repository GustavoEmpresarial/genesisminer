apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: genesis
resources:
  - ../../
  - ../../../kafka/k8s/service.yaml
  - ../../../kafka/k8s/statefulset.yaml
  - ../../../kafka/k8s/topics-job.yaml
patches:
  - path: patch-configmap-kafka.yaml
    target:
      kind: ConfigMap
      name: genesis-app-config
commonLabels:
  app.kubernetes.io/part-of: minestation
  genesis.io/overlay: with-kafka
