# Copiar para secret-app.yaml (gitignored) e preencher.
# kubectl create secret generic genesis-app-secrets -n genesis --from-env-file=...
apiVersion: v1
kind: Secret
metadata:
  name: genesis-app-secrets
  namespace: genesis
  labels:
    app.kubernetes.io/name: genesis-app
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:change-me@postgres.genesis.svc:5432/minestation"
  REDIS_URL: "redis://redis.genesis.svc:6379"
  JWT_SECRET: "change-me-long-random"
  FRONTEND_URL: "https://dev.genesisdao.tech"
  CORS_EXTRA_ORIGINS: "https://dev.genesisdao.tech"
  # Opcionais — alinhar a deploy/.env.example
  POLYGON_RPC: ""
  # SMTP: 587+MAIL_SECURE=0 (STARTTLS) ou 465+MAIL_SECURE=1 (SMTPS)
  MAIL_HOST: ""
  MAIL_PORT: "587"
  MAIL_SECURE: "0"
  MAIL_USER: ""
  MAIL_PASS: ""
  MAIL_FROM: ""
  CLOUDFLARE_TURNSTILE_ENABLED: "0"
  CLOUDFLARE_TURNSTILE_SITE_KEY: ""
  CLOUDFLARE_TURNSTILE_SECRET_KEY: ""
  ETHERSCAN_API_KEY: ""
