apiVersion: v1
kind: ConfigMap
metadata:
  name: genesis-app-config
  namespace: genesis
  labels:
    app.kubernetes.io/name: genesis-app
data:
  NODE_ENV: "production"
  PORT: "3000"
  SCHEDULER_ENABLED: "1"
  # Paths alinhados a docs/operations/STORAGE.md (montagens PVC).
  IMG_DIR: "/app/storage/media-seed"
  IMG_UPLOADS_DIR: "/app/storage/uploads"
  BACKUP_DIR: "/app/storage/backups"
  # Kafka (infra pronta; app só consome quando KAFKA_ENABLED=1 no código).
  KAFKA_ENABLED: "0"
  KAFKA_BROKERS: "genesis-kafka-bootstrap.genesis.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "genesis-app"
