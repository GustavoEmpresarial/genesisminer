apiVersion: v1
kind: Service
metadata:
  name: genesis-kafka-bootstrap
  namespace: genesis
  labels:
    app.kubernetes.io/name: genesis-kafka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: genesis-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
# Headless — DNS estável por pod (genesis-kafka-0.genesis-kafka-headless...).
apiVersion: v1
kind: Service
metadata:
  name: genesis-kafka-headless
  namespace: genesis
  labels:
    app.kubernetes.io/name: genesis-kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: genesis-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: controller
      port: 9093
      targetPort: controller
