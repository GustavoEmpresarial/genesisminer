[package]
name = "genesis-mining-worker"
description = "Mining engine binary — yield cron + progress I/O in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "genesis-mining-worker"
path = "src/main.rs"

[dependencies]
genesis-core = { path = "../genesis-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "fs", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace"] }
rdkafka = { version = "0.37", features = ["cmake-build", "tokio"] }
webp = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
