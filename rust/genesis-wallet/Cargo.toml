[package]
name = "genesis-wallet"
description = "Wallet money TX binary — exchange / withdraw / deposit / quest / referral / offerwall / admin HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "genesis-wallet"
path = "src/main.rs"

[dependencies]
genesis-core = { path = "../genesis-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha3 = "0.10"
sha1 = "0.10"
hex = "0.4"
parking_lot = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
