[package]
name = "genesis-api"
description = "Public game HTTP — player facades + admin Express proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "genesis-api"
path = "src/main.rs"

[dependencies]
genesis-core = { path = "../genesis-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
http = "1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
socketioxide = { version = "0.18", features = ["state", "tracing", "extensions"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
